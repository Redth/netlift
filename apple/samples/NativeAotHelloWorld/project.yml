name: NativeAotHelloWorld
options:
  bundleIdPrefix: dev.netlift
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NativeAotHelloWorld:
    type: application
    platform: iOS
    sources:
      - path: Sources/HelloWorld
      - path: Build/$(CONFIGURATION)-$(SDK_NAME)/swift/NetLiftContracts.swift
        optional: true
      - path: Build/$(CONFIGURATION)-$(SDK_NAME)/swift/NetLiftAppleAotTransport.swift
        optional: true
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.netlift.nativeaot.helloworld
        PRODUCT_NAME: NativeAotHelloWorld
        GENERATE_INFOPLIST_FILE: NO
        NETLIFT_MANAGED_PROJECT: Managed/Hello.csproj
        NETLIFT_CONTRACT_ROOTS: NetLift.NativeAotHelloWorld.IHelloService
        NETLIFT_SWIFT_MODULE: HelloWorld
        NETLIFT_MANAGED_FRAMEWORK: net10.0
        NETLIFT_REPOSITORY_ROOT: $(SRCROOT)/../../../
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Build/$(CONFIGURATION)-$(SDK_NAME)/frameworks/current
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - NetLiftAppleAot
    preBuildScripts:
      - name: Build managed NativeAOT component
        script: |
          /bin/bash "${SRCROOT}/build_for_xcode.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - Build/$(CONFIGURATION)-$(SDK_NAME)/swift/NetLiftContracts.swift
          - Build/$(CONFIGURATION)-$(SDK_NAME)/swift/NetLiftAppleAotTransport.swift
    postCompileScripts:
      - name: Embed managed NativeAOT framework
        script: |
          set -euo pipefail
          output="${SRCROOT}/Build/${CONFIGURATION}-${SDK_NAME}"
          case "${PLATFORM_NAME}" in
            iphonesimulator) slice="simulator" ;;
            iphoneos) slice="device" ;;
            *) exit 1 ;;
          esac
          source="${output}/frameworks/${slice}/NetLiftAppleAot.framework"
          destination="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/NetLiftAppleAot.framework"
          mkdir -p "$(dirname "${destination}")"
          ditto "${source}" "${destination}"
        basedOnDependencyAnalysis: false
