name: OrdersHost
include:
  - path: ../../NetLiftWorkload.yml
    relativePaths: false
targets:
  OrdersHost:
    templates:
      - NetLiftWorkloadApp
    sources:
      - NativeApp.swift
      - NativeMain.mm
      - ManagedBridge.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.netlift.workloadlibrarymode.nativeapp
        NETLIFT_REPOSITORY_ROOT: $(SRCROOT)/../../../
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/ManagedBridge.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS:
          - $(inherited)
          - NETLIFT_NATIVE_CALLBACKS
