name: MauiEmbedding
include:
  - path: ../../../apple/NetLiftWorkload.yml
    relativePaths: false
targets:
  MauiEmbedding:
    templates:
      - NetLiftWorkloadApp
    sources:
      - NativeApp.swift
      - NativeMain.mm
      - ManagedBridge.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.netlift.maui.swiftui
        NETLIFT_REPOSITORY_ROOT: $(SRCROOT)/../../../../
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/ManagedBridge.h
