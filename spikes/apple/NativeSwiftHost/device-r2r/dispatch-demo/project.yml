name: DispatchDemo
options:
  bundleIdPrefix: org.netlift.apple
  deploymentTarget:
    iOS: "15.0"
targets:
  DispatchDemo:
    type: application
    platform: iOS
    dependencies:
      - package: AppleManagedHost
        product: AppleManagedHost
      - package: AppleManagedHost
        product: AppleManagedHostRuntime
      - framework: .artifacts/Frameworks/NetLift.DispatchDemo.r2r.framework
        embed: true
        link: true
    sources:
      - path: DispatchDemoApp.swift
      - path: DispatchDemoManagedAdapter.swift
      - path: AppleManagedHostRuntimeCallbacks.mm
      - path: .artifacts/generated-swift/NetLift.swift
    preBuildScripts:
      - name: Stage dispatch-demo .NET 11 device runtime assets
        basedOnDependencyAnalysis: false
        script: |
          bash "$SRCROOT/stage-device-runtime.sh" \
            "$PLATFORM_NAME" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    postBuildScripts:
      - name: Embed .NET runtime R2R module
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          cp "$SRCROOT/.artifacts/native/Microsoft.NETCore.App.r2r.dylib" \
            "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.netlift.apple.dispatchdemo
        PRODUCT_NAME: DispatchDemo
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/.artifacts/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(SRCROOT)/.artifacts/registration/r2r_modules.o"
          - "$(SRCROOT)/.artifacts/native/libxamarin-dotnet-coreclr.a"
          - "$(SRCROOT)/.artifacts/native/Microsoft.NETCore.App.r2r.dylib"
packages:
  AppleManagedHost:
    path: ../AppleManagedHost
