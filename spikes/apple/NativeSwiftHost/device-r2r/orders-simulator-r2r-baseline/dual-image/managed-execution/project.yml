name: OrdersR2RManagedExecution
options:
  bundleIdPrefix: org.netlift.apple
  deploymentTarget:
    iOS: "15.0"
targets:
  OrdersR2RManagedAppOwnerProbe:
    type: application
    platform: iOS
    dependencies:
      - package: AppleManagedHost
        product: AppleManagedHost
      - package: AppleManagedHost
        product: AppleManagedHostRuntime
      - framework: ../.artifacts/simulator/Frameworks/NetLift.ManagedBridge.r2r.framework
        embed: true
        link: true
    sources:
      - path: OrdersR2RManagedExecutionApp.swift
      - path: OrdersR2RManagedExecutionHost.mm
    preBuildScripts:
      - name: Stage existing app-owned Orders simulator runtime assets
        basedOnDependencyAnalysis: false
        script: |
          bash "$SRCROOT/../stage-simulator-runtime.sh" \
            "$PLATFORM_NAME" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    postBuildScripts:
      - name: Embed existing runtime R2R image
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          cp "$SRCROOT/../.artifacts/simulator/native/Microsoft.NETCore.App.r2r.dylib" \
            "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.netlift.apple.orders.r2r.managed.appowner
        PRODUCT_NAME: OrdersR2RManagedAppOwnerProbe
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphonesimulator
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../.artifacts/simulator/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(SRCROOT)/../.artifacts/simulator/registration/r2r_modules.o"
          - "$(SRCROOT)/../.artifacts/simulator/native/libxamarin-dotnet-coreclr.a"
          - "$(SRCROOT)/../.artifacts/simulator/native/Microsoft.NETCore.App.r2r.dylib"
  OrdersR2RManagedRuntimeOwnerProbe:
    type: application
    platform: iOS
    dependencies:
      - package: AppleManagedHost
        product: AppleManagedHost
      - package: AppleManagedHost
        product: AppleManagedHostRuntime
      - framework: ../.artifacts/simulator/Frameworks/NetLift.ManagedBridge.r2r.framework
        embed: true
        link: true
    sources:
      - path: OrdersR2RManagedExecutionApp.swift
      - path: OrdersR2RManagedExecutionHost.mm
    preBuildScripts:
      - name: Stage existing app-owned Orders simulator runtime assets
        basedOnDependencyAnalysis: false
        script: |
          bash "$SRCROOT/../stage-simulator-runtime.sh" \
            "$PLATFORM_NAME" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    postBuildScripts:
      - name: Embed existing runtime R2R image
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          cp "$SRCROOT/../.artifacts/simulator/native/Microsoft.NETCore.App.r2r.dylib" \
            "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.netlift.apple.orders.r2r.managed.runtimeowner
        PRODUCT_NAME: OrdersR2RManagedRuntimeOwnerProbe
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphonesimulator
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../.artifacts/simulator/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path"
          - "@executable_path/Frameworks"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "ORDERS_R2R_EXPECT_RUNTIME_OWNER=1"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(SRCROOT)/../.artifacts/simulator/registration/r2r_modules.o"
          - "$(SRCROOT)/../.artifacts/simulator/native/libxamarin-dotnet-coreclr.a"
          - "$(SRCROOT)/../.artifacts/simulator/native/Microsoft.NETCore.App.r2r.dylib"
packages:
  AppleManagedHost:
    path: ../../../AppleManagedHost
