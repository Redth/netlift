name: OrdersR2RSimulatorProbe
options:
  bundleIdPrefix: org.netlift.apple
  deploymentTarget:
    iOS: "15.0"
targets:
  OrdersR2RSimulatorProbe:
    type: application
    platform: iOS
    dependencies:
      - package: AppleManagedHost
        product: AppleManagedHost
      - package: AppleManagedHost
        product: AppleManagedHostRuntime
      - framework: .artifacts/simulator/Frameworks/NetLift.ManagedBridge.r2r.framework
        embed: true
        link: true
    sources:
      - path: OrdersR2RProbeApp.swift
      - path: OrdersR2RProbeHost.mm
    preBuildScripts:
      - name: Stage Orders R2R simulator baseline runtime assets
        basedOnDependencyAnalysis: false
        script: |
          bash "$SRCROOT/stage-simulator-runtime.sh" \
            "$PLATFORM_NAME" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.netlift.apple.orders.r2r.simulatorprobe
        PRODUCT_NAME: OrdersR2RSimulatorProbe
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphonesimulator
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/.artifacts/simulator/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(SRCROOT)/.artifacts/simulator/registration/r2r_modules.o"
          - "$(SRCROOT)/.artifacts/simulator/native/libxamarin-dotnet-coreclr.a"
packages:
  AppleManagedHost:
    path: ../AppleManagedHost
