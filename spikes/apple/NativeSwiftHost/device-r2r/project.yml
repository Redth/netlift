name: NativeSwiftHostDeviceR2R
options:
  bundleIdPrefix: org.netlift.apple
  deploymentTarget:
    iOS: "15.0"
targets:
  NativeSwiftHostDeviceR2R:
    type: application
    platform: iOS
    dependencies:
      - package: AppleManagedHost
        product: AppleManagedHost
      - package: AppleManagedHost
        product: AppleManagedHostRuntime
      - framework: ../.artifacts/experiments/device-r2r-host/Frameworks/NetLift.ManagedBridge.r2r.framework
        embed: true
        link: true
    sources:
      - path: DeviceR2RApp.swift
      - path: DeviceR2RManagedAdapter.swift
      - path: DeviceR2RHost.mm
    preBuildScripts:
      - name: Stage .NET 11 device runtime and managed libraries
        basedOnDependencyAnalysis: false
        script: |
          bash "$SRCROOT/stage-device-runtime.sh" \
            "$PLATFORM_NAME" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    postBuildScripts:
      - name: Embed runtime ReadyToRun image
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          cp "$SRCROOT/../.artifacts/experiments/device-r2r-host/native/Microsoft.NETCore.App.r2r.dylib" \
            "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.netlift.apple.nativeswifthost.devicer2r
        PRODUCT_NAME: NativeSwiftHostDeviceR2R
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../.artifacts/experiments/device-r2r-host/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(SRCROOT)/../.artifacts/experiments/device-r2r-host/registration/r2r_modules.o"
          - "$(SRCROOT)/../.artifacts/experiments/device-r2r-host/native/libxamarin-dotnet-coreclr.a"
          - "$(SRCROOT)/../.artifacts/experiments/device-r2r-host/native/Microsoft.NETCore.App.r2r.dylib"
packages:
  AppleManagedHost:
    path: AppleManagedHost
