name: NativeSwiftHostR2RLinkOnly
options:
  bundleIdPrefix: org.netlift.apple
  deploymentTarget:
    iOS: "15.0"
targets:
  NativeSwiftHostR2RLinkOnly:
    type: application
    platform: iOS
    sources:
      - path: R2RLinkOnlyApp.swift
      - path: ../CoreCLRHost.m
    dependencies:
      - framework: ../.artifacts/experiments/r2r-host-link-only/Frameworks/NetLift.ManagedBridge.r2r.framework
        embed: true
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.netlift.apple.r2rlinkonly
        PRODUCT_NAME: NativeSwiftHostR2RLinkOnly
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../.artifacts/experiments/r2r-host-link-only/Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../Generated"
          - "$(SRCROOT)/../.artifacts/experiments/r2r-host-link-only/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../.artifacts/experiments/r2r-host-link-only/native"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(SRCROOT)/../.artifacts/experiments/r2r-host-link-only/registration/r2r_modules.o"
          - "$(SRCROOT)/../.artifacts/experiments/r2r-host-link-only/native/libxamarin-dotnet-coreclr.a"
