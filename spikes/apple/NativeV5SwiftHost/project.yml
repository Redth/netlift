name: NativeV5SwiftHost
options:
  bundleIdPrefix: org.netlift
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  NetLiftV5AppleHost:
    path: .artifacts/swift-package
targets:
  NativeV5SwiftHost:
    type: application
    platform: iOS
    sources:
      - NativeV5SwiftHostApp.swift
    dependencies:
      - package: NetLiftV5AppleHost
        product: NetLiftV5Host
      - package: NetLiftV5AppleHost
        product: NetLiftV5OldCodec
      - package: NetLiftV5AppleHost
        product: NetLiftV5NewCodec
    preBuildScripts:
      - name: Stage .NET 11 simulator runtime and managed images
        basedOnDependencyAnalysis: false
        script: |
          sh "$SRCROOT/stage-runtime.sh" \
            "$CONFIGURATION" \
            "$PLATFORM_NAME" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.netlift.nativev5swifthost
        PRODUCT_NAME: NativeV5SwiftHost
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        CODE_SIGN_STYLE: Automatic
